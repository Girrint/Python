{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="mb-4">

                    Login

                </h3>

                <form method="POST">

                    <div class="mb-3">

                        <label>
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        class="btn btn-primary w-100"
                    >

                        Login

                    </button>

                </form>

                <div class="mt-3">

                    <a href="/register">

                        Create account

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
