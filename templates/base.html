<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0"
    >

    <title>Store Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="{{ url_for('dashboard.dashboard') }}">

            Store Management

        </a>

        <div>

            <a class="btn btn-outline-light me-2"
               href="{{ url_for(
                   'dashboard.dashboard'
               ) }}">

                Dashboard

            </a>

            <a class="btn btn-outline-light me-2"
               href="{{ url_for(
                   'product.list_products'
               ) }}">

                Products

            </a>

            <a class="btn btn-outline-light me-2"
               href="{{ url_for(
                   'customer.list_customers'
               ) }}">

                Customers

            </a>

            <a class="btn btn-outline-light me-2"
               href="{{ url_for(
                   'order.list_orders'
               ) }}">

                Orders

            </a>

            <a class="btn btn-danger"
               href="{{ url_for(
                   'auth.logout'
               ) }}">

                Logout

            </a>

        </div>

    </div>

</nav>

<div class="container mt-4">

    {% with messages =
        get_flashed_messages(
            with_categories=true
        )
    %}

        {% if messages %}

            {% for category, message
                in messages
            %}

                <div class="
                    alert
                    alert-{{ category }}
                ">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    {% block content %}
    {% endblock %}

</div>

<script>

    setTimeout(() => {

        document
            .querySelectorAll('.alert')
            .forEach(alert => {

                alert.style.display = 'none';

            });

    }, 3000);

</script>

</body>

</html>
