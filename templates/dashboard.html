{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">

    Dashboard

</h2>

<div class="row">

    <div class="col-md-4">

        <div class="card shadow-sm">

            <div class="card-body">

                <h5>Total Products</h5>

                <h2>
                    {{ total_products }}
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card shadow-sm">

            <div class="card-body">

                <h5>Total Orders</h5>

                <h2>
                    {{ total_orders }}
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card shadow-sm">

            <div class="card-body">

                <h5>Total Revenue</h5>

                <h2>
                    ${{ total_revenue }}
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-4 mt-3">

        <div class="card shadow-sm">

            <div class="card-body">

                <h5>Total Customers</h5>

                <h2>
                    {{ total_customers }}
                </h2>

            </div>

        </div>

    </div>

</div>

{% endblock %}
