{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="mb-4">

                    Create Customer

                </h3>

                <form method="POST">

                    <div class="mb-3">

                        <label>
                            Customer Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label>
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                        >

                    </div>

                    <div class="mb-3">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                        >

                    </div>

                    <div class="mb-3">

                        <label>
                            Address
                        </label>

                        <textarea
                            name="address"
                            class="form-control"
                            rows="3"
                        ></textarea>

                    </div>

                    <button
                        class="btn btn-success"
                    >

                        Save Customer

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
