{% extends 'base.html' %}

{% block content %}

<div class="
    d-flex
    justify-content-between
    align-items-center
    mb-4
">

    <h2>Customers</h2>

    <a
        href="/customers/create"
        class="btn btn-primary"
    >
        Add Customer
    </a>

</div>

<table class="table table-bordered">

    <thead class="table-dark">

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Phone</th>

            <th>Email</th>

            <th>Address</th>

            <th width="220">
                Actions
            </th>

        </tr>

    </thead>

    <tbody>

        {% for customer in customers %}

        <tr>

            <td>
                {{ customer.id }}
            </td>

            <td>
                {{ customer.name }}
            </td>

            <td>
                {{ customer.phone }}
            </td>

            <td>
                {{ customer.email }}
            </td>

            <td>
                {{ customer.address }}
            </td>

            <td>

                <a
                    href="/customers/edit/{{ customer.id }}"
                    class="btn btn-warning btn-sm"
                >
                    Edit
                </a>

                <a
                    href="/customers/delete/{{ customer.id }}"
                    class="btn btn-danger btn-sm"
                    onclick="
                        return confirm(
                            'Delete this customer?'
                        )
                    "
                >
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
