{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="mb-4">

                    Create Product

                </h3>

                <form
                    method="POST"
                    enctype="multipart/form-data"
                >

                    <div class="mb-3">

                        <label>
                            Product Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label>
                            Price
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="price"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label>
                            Quantity
                        </label>

                        <input
                            type="number"
                            name="quantity"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label>
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"
                        ></textarea>

                    </div>

                    <div class="mb-3">

                        <label>
                            Product Image
                        </label>

                        <input
                            type="file"
                            name="image"
                            class="form-control"
                        >

                    </div>

                    <button
                        class="btn btn-success"
                    >

                        Save Product

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
