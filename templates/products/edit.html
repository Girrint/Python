{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="mb-4">

                    Edit Product

                </h3>

                <form method="POST">

                    <div class="mb-3">

                        <label>
                            Product Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ product.name }}"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label>
                            Price
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="price"
                            class="form-control"
                            value="{{ product.price }}"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label>
                            Quantity
                        </label>

                        <input
                            type="number"
                            name="quantity"
                            class="form-control"
                            value="{{ product.quantity }}"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label>
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"
                        >{{ product.description }}</textarea>

                    </div>

                    <button
                        class="btn btn-warning"
                    >

                        Update Product

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
