{% extends 'base.html' %}

{% block content %}

<div class="row">

    <div class="col-md-4">

        {% if product.image %}

        <img
            src="{{ url_for(
                'static',
                filename='uploads/' + product.image
            ) }}"
            class="img-fluid rounded shadow"
        >

        {% endif %}

    </div>

    <div class="col-md-8">

        <h2>
            {{ product.name }}
        </h2>

        <hr>

        <h4>
            ${{ product.price }}
        </h4>

        <p>

            <strong>
                Quantity:
            </strong>

            {{ product.quantity }}

        </p>

        <p>

            <strong>
                Description:
            </strong>

            {{ product.description }}

        </p>

        {% if product.qr_code %}

        <div class="mt-3">

            <img
                src="{{ url_for(
                    'static',
                    filename='qrcodes/' + product.qr_code
                ) }}"
                width="180"
            >

        </div>

        {% endif %}

    </div>

</div>

{% endblock %}
